# Blueprint do Render: cria o PostgreSQL e a API de uma vez.
# No Render: New > Blueprint > selecionar este repositório > Apply.
databases:
  - name: locadora-veiculos-db
    plan: free
    databaseName: locadora
    user: locadora

services:
  - type: web
    name: locadora-veiculos-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # URL interna do PostgreSQL criado acima (preenchida pelo Render).
      - key: DATABASE_URL
        fromDatabase:
          name: locadora-veiculos-db
          property: connectionString
